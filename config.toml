# EVM Arbitrage Scanner — public production scanner configuration.
# READ-ONLY: RPC reads, local math, exact quote calls, local cache/SQLite persistence.
# This binary does not contain transaction signing, private-key handling, relay submission,
# public-mempool submission, deployment, or trade execution code.
#
# RPC endpoints are loaded from environment variables; never put provider secrets here.
# Default enabled set: Arbitrum, Base, Optimism. Tier-3 chains remain configured but disabled
# because the final six-hour benchmark found little useful breadth there and poor zkSync RPC health.

summary_interval_secs = 60
top_candidates = 40
min_trade_usd = 10.0
max_trade_usd = 100000.0
min_pool_anchor_liquidity_usd = 10000.0
exact_quote_budget_per_scan = 30
max_cycles_per_depth = 250000
sizing_grid_points = 6
sizing_refine_iterations = 1
multicall3_address = "0xcA11bde05977b3631167028862bE2a173976CA11"
multicall_max_calls = 80
output_dir = "data/scanner"
artifact_prefix = "scanner"
analytical_sizing_enabled = true
analytical_sizing_iterations = 28
analytical_validation_band_pct = 3.0

# -----------------------------------------------------------------------------
# Tier 1 — Arbitrum One
# Existing V3.2.2 coverage preserved: Uni V2/V3, Sushi V2, Pancake V2/V3,
# Camelot Algebra. Current working-tree addresses are carried forward unchanged.
# -----------------------------------------------------------------------------
[[chains]]
name = "arbitrum"
chain_id = 42161
enabled = true
tier = 1
rpc_url_env = "ARBITRUM_RPC_URL"
poll_interval_ms = 3000
rpc_max_attempts = 4
rpc_retry_base_ms = 100
rpc_retry_max_ms = 1500
rpc_request_timeout_ms = 6000
discovery_concurrency = 4
discovery_probe_delay_ms = 25
discovery_rpc_min_request_spacing_ms = 500
discovery_rpc_max_attempts = 8
discovery_rpc_retry_max_ms = 5000
pool_cache_path = "data/scanner/pool_cache_arbitrum.json"
opportunity_db_path = "data/scanner/opportunities_arbitrum.sqlite"
pool_cache_ttl_hours = 24
liquidity_refresh_blocks = 80
flash_loan_premium_bps = 5.0
# Model small routes as self-funded; above this cap the scanner applies the configured flash-premium assumption.
self_funded_capital_usd = 200.0
min_net_profit_usd = 1.0
# L2 ordering/bidding differs from Ethereum; do not import the old 50% builder reserve.
mev_bid_reserve_pct = 0.0


# Cold-cache universe expansion. Standard V2/V3 factory creation events
# discover neighboring routing tokens; all configured venues are then probed across
# the retained pair graph. A fresh pool cache prevents repeating this work every run.
[chains.universe_expansion]
enabled = true
lookback_blocks = 150000000
log_chunk_blocks = 2000000
min_log_chunk_blocks = 2000
frontier_rounds = 2
max_auto_tokens = 48
max_event_pairs = 400
max_logs_per_factory = 50000
# Conservative routing policy: do not auto-enroll common lending/vault wrapper symbols.
# Explicit seed tokens remain unchanged; extend this list if your policy requires it.
auto_token_symbol_deny_prefixes = ["aArb", "aOpt", "aBas", "stata", "cUSDCv3", "cWETHv3"]

