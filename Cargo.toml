[package]
name = "evm-arb-scanner"
version = "1.0.0"
edition = "2021"
description = "Read-only multichain EVM DEX arbitrage research scanner with 2-4 hop routing, resilient RPC handling, persistent evidence, and local sizing."
license = "MIT"
readme = "README.md"
keywords = ["ethereum", "arbitrage", "defi", "rust", "scanner"]
categories = ["command-line-utilities"]

[dependencies]
dotenvy = "0.15"
ethabi = "18"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
toml = "0.8"
tiny-keccak = { version = "2", features = ["keccak"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
